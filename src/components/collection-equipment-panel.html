<div
    x-data="collectionEquipmentPanel"
    class="ch-equipment-panel"
    :class="{ 'is-mobile-detail-open': selected }"
    @equipment-select="select($event.detail.id)"
>
    <div class="ch-equipment-toolbar">
        <strong>장비</strong><span>파편 <b x-text="state.summary.shards"></b></span>
        <button class="ch-btn" type="button" @click="openShop()">상점</button>
    </div>
    <div class="ch-equipment-browser">
        <section class="ch-equipment-slots" aria-label="장착 슬롯">
            <h4 x-text="`공용 장착 슬롯 · 장착 ${equippedCount}/6`"></h4>
            <div class="ch-equipment-slot-grid">
                <template x-for="slot in state.equipment.slots" :key="slot.index">
                    <button
                        class="ch-equipment-slot"
                        type="button"
                        @click="unequip(slot.index)"
                        :disabled="!slot.templateId"
                        :aria-label="slot.name ? `${slot.index + 1}번 슬롯 ${slot.name} 장착 해제` : `${slot.index + 1}번 빈 슬롯`"
                    >
                        <canvas x-show="slot.iconTag" x-equipment-icon-tag="slot.iconTag" aria-hidden="true"></canvas>
                        <span x-show="!slot.name" aria-hidden="true">+</span>
                        <span class="ch-equipment-slot-name" x-text="slot.name || '빈 슬롯'"></span>
                        <small
                            x-show="slot.stats.length"
                            x-text="slot.stats.map((stat) => `${stat.label} +${stat.value}`).join(' · ')"
                        ></small>
                    </button>
                </template>
            </div>
        </section>
        <nav class="ch-equipment-filter" aria-label="장비 필터">
            <template x-for="option in filterOptions" :key="option.id">
                <button
                    type="button"
                    :class="{ 'is-active': filter === option.id }"
                    :aria-pressed="filter === option.id"
                    @click="filter = option.id"
                    x-text="option.label"
                ></button>
            </template>
        </nav>
        <div class="ch-equipment-catalog" role="region" aria-label="장비 목록">
            <template x-for="tier in filteredTiers" :key="tier.id">
                <section class="ch-equipment-tier">
                    <h4 x-text="tier.label"></h4>
                    <div class="ch-equipment-card-grid">
                        <template x-for="item in tier.templates" :key="item.id">
                            <button
                                class="ch-equipment-card"
                                type="button"
                                :class="{ 'is-selected': selectedId === item.id, 'is-unowned': item.count === 0 }"
                                @click="select(item.id)"
                            >
                                <canvas x-equipment-icon-tag="item.iconTag" aria-hidden="true"></canvas>
                                <div class="ch-equipment-card-copy">
                                    <strong x-text="item.name"></strong
                                    ><span
                                        class="ch-equipment-count"
                                        x-text="item.count > 0 ? `보유 ${item.count}` : '미보유'"
                                    ></span>
                                </div>
                                <div class="ch-equipment-stats">
                                    <template x-for="stat in item.stats" :key="stat.id"
                                        ><span x-text="`${stat.label} +${stat.value}`"></span
                                    ></template>
                                </div>
                                <p class="ch-equipment-passive" x-show="item.passive" x-text="item.passive?.name"></p>
                            </button>
                        </template>
                    </div>
                    <div class="ch-equipment-mobile-list">
                        <template x-for="item in tier.templates" :key="item.id">
                            <article class="ch-equipment-mobile-card" :class="{ 'is-unowned': item.count === 0 }">
                                <button
                                    class="ch-equipment-mobile-select"
                                    type="button"
                                    @click="select(item.id)"
                                    :aria-label="`${item.name} ${item.tierLabel} 장비 상세 보기`"
                                >
                                    <canvas x-equipment-icon-tag="item.iconTag" aria-hidden="true"></canvas>
                                    <span class="ch-equipment-mobile-copy"
                                        ><strong x-text="item.name"></strong><small x-text="item.tierLabel"></small
                                        ><span
                                            x-text="item.stats.map((stat) => `${stat.label} +${stat.value}`).join(' · ')"
                                        ></span
                                        ><em x-text="item.count > 0 ? `보유 ${item.count}` : '미보유'"></em
                                    ></span>
                                </button>
                                <div class="ch-equipment-mobile-builds" aria-label="상위 조합">
                                    <template x-if="item.buildsInto.length"
                                        ><template x-for="upgrade in item.buildsInto" :key="upgrade.id"
                                            ><button
                                                type="button"
                                                @click="select(upgrade.id)"
                                                :aria-label="`${upgrade.name} 상위 조합 장비 상세 보기`"
                                            >
                                                <canvas
                                                    x-equipment-icon-tag="upgrade.iconTag"
                                                    aria-hidden="true"
                                                ></canvas
                                                ><span x-text="upgrade.name"></span></button></template
                                    ></template>
                                    <span class="ch-equipment-final" x-show="!item.buildsInto.length">최종 장비</span>
                                </div>
                            </article>
                        </template>
                    </div>
                </section>
            </template>
        </div>
    </div>
    <aside class="ch-equipment-detail" x-show="selected" x-cloak>

                                            type="button"

                                        >

                                            ><span x-text="item.name"></span
                                            ><small
                                                x-text="item.count > 0 ? `보유 ${item.count}` : '미보유'"
                                            ></small></button
                                    ></template>
                                </div>
                                <span class="ch-equipment-final" x-show="!selected.buildsInto.length">최종 장비</span>
                            </section>
                        </div>
                        <template x-if="selected.recipe"
                            ><div
                                class="ch-equipment-recipe-tree"
                                x-data="{ get tree() { return selected.recipe.tree; } }"
                            >
                                <recipe-tree x-component="'recipe-tree'"></recipe-tree>
                            </div>
                            <p
                                class="ch-equipment-missing"
                                x-show="selected.recipe.missingReason"
                                x-text="craftMessage(selected.recipe.missingReason)"
                            ></p
                        ></template>
                    </div>
                    <p class="ch-equipment-feedback" x-show="feedback" x-text="feedback"></p>
                </div>
                <div class="ch-equipment-detail-actions">
                    <button
                        class="ch-btn"
                        type="button"
                        x-show="selected.recipe"
                        :disabled="!selected.recipe?.canCraft"
                        @click="craft(selected.id)"
                    >
                        조합</button
                    ><button
                        class="ch-btn"
                        type="button"
                        :disabled="selected.count === 0 || slotsFull"
                        @click="equip(selected.id)"
                    >
                        장착
                    </button>
                </div>
            </div></template
        >
    </aside>
    <collection-shop-panel></collection-shop-panel>
</div>

<script>
    window.createGameUI("collectionEquipmentPanel", () => ({
        selectedId: null,
        filter: "all",
        feedback: "",
        filterOptions: [
            { id: "all", label: "전체" },
            { id: "owned", label: "보유" },
            { id: "basic", label: "기초" },
            { id: "intermediate", label: "중간" },
            { id: "completed", label: "완성" }
        ],
        get state() {
            return Alpine.store("uiManager").requireComponent("collectionHub").state;
        },
        get selected() {
            return (
                this.state.equipment.tiers
                    .flatMap((tier) => tier.templates)
                    .find((item) => item.id === this.selectedId) ?? null
            );
        },
        get slotsFull() {
            return this.state.equipment.slots.every((slot) => slot.templateId);
        },
        get equippedCount() {
            return this.state.equipment.slots.filter((slot) => slot.templateId).length;
        },
        get filteredTiers() {
            return this.state.equipment.tiers
                .map((tier) => ({
                    ...tier,
                    templates: tier.templates.filter(
                        (item) =>
                            this.filter === "all" ||
                            (this.filter === "owned" ? item.count > 0 : item.tier === this.filter)
                    )
                }))
                .filter((tier) => tier.templates.length);
        },
        select(id) {
            this.selectedId = id;
            this.feedback = "";
            this.$nextTick(() => {
                const detailBody = this.$root.querySelector(".ch-equipment-detail-body");
                if (detailBody) detailBody.scrollTop = 0;
            });
        },
        closeDetail() {
            this.selectedId = null;
            this.feedback = "";
        },
        craftMessage(reason) {
            return (
                {
                    "missing ingredients": "재료가 부족합니다.",
                    "missing shards": "파편이 부족합니다.",
                    capacity: "보유 한도에 도달했습니다.",
                    recipe: "조합법이 없습니다."
                }[reason] ?? "조합할 수 없습니다."
            );
        },
        equip(templateId) {
            const result = Alpine.store("uiManager").invokeGameAction("equipEquipmentTemplate", templateId);
            this.feedback = result.ok ? "장착했습니다." : "장착할 수 없습니다. 빈 슬롯 또는 보유 수량을 확인하세요.";
        },
        unequip(slotIndex) {
            const result = Alpine.store("uiManager").invokeGameAction("unequipEquipmentSlot", slotIndex);
            if (result.ok) this.feedback = "장착을 해제했습니다.";
        },
        openShop() {
            Alpine.store("uiManager").getComponent("collectionShopPanel")?.show?.();
        },
        craft(templateId) {
            const result = Alpine.store("uiManager").invokeGameAction("craftEquipmentTemplate", templateId);
            this.feedback = result.ok
                ? "조합했습니다."
                : this.craftMessage(result.reason ?? result.preview?.missingReason);
        }
    }));
</script>
