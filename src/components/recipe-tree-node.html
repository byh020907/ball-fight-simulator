<div class="ch-recipe-branch" :class="{ 'is-root': node.isRoot, 'has-children': node.children.length > 0 }">
    <article
        x-show="node.isRoot"
        class="ch-recipe-node"
        :class="{ 'is-root': node.isRoot, 'is-satisfied': !node.isRoot && node.satisfied, 'is-missing': !node.isRoot && !node.satisfied }"
        role="treeitem"
        :aria-level="node.depth + 1"
        :aria-label="node.name + ': 보유 ' + node.owned + ', 필요 ' + node.required + ', ' + (node.isRoot ? '결과 장비' : (node.satisfied ? '충족' : '부족 ' + Math.max(0, node.required - node.owned)))"
    >
        <div class="ch-recipe-icon">
            <canvas x-equipment-icon-tag="node.iconTag" aria-hidden="true"></canvas>
            <span class="ch-recipe-quantity" x-show="node.required >= 2" x-text="`×${node.required}`"></span>
        </div>
        <strong x-text="node.name"></strong>
        <span
            class="ch-recipe-meta"
            x-show="!node.isRoot"
            :class="{ 'is-satisfied': node.satisfied }"
            x-text="node.satisfied ? `보유 ${node.owned}/${node.required}` : `부족 ${Math.max(0, node.required - node.owned)} · ${node.owned}/${node.required}`"
        ></span>
        <span class="ch-recipe-meta is-root" x-show="node.isRoot">완성 장비</span>
    </article>
    <button
        x-show="!node.isRoot"
        class="ch-recipe-node"
        :class="{ 'is-satisfied': node.satisfied, 'is-missing': !node.satisfied }"
        type="button"
        role="treeitem"
        :aria-level="node.depth + 1"
        :aria-label="node.name + ': 보유 ' + node.owned + ', 필요 ' + node.required + ', ' + (node.satisfied ? '충족' : '부족 ' + Math.max(0, node.required - node.owned)) + ', 장비 상세 보기'"
        @click="$dispatch('equipment-select', { id: node.id })"
    >
        <div class="ch-recipe-icon">
            <canvas x-equipment-icon-tag="node.iconTag" aria-hidden="true"></canvas>
            <span class="ch-recipe-quantity" x-show="node.required >= 2" x-text="`×${node.required}`"></span>
        </div>
        <strong x-text="node.name"></strong>
        <span
            class="ch-recipe-meta"
            :class="{ 'is-satisfied': node.satisfied }"
            x-text="node.satisfied ? `보유 ${node.owned}/${node.required}` : `부족 ${Math.max(0, node.required - node.owned)} · ${node.owned}/${node.required}`"
        ></span>
    </button>

    <template x-if="node.children.length > 0">
        <div
            class="ch-recipe-children"
            :class="{ 'is-single': node.children.length === 1 }"
            role="group"
            :aria-label="`${node.name} 재료`"
        >
            <template x-for="child in node.children" :key="child.key">
                <recipe-tree-node
                    x-data="{ get node() { return child; } }"
                    x-component="'recipe-tree-node'"
                ></recipe-tree-node>
            </template>
        </div>
    </template>
</div>
