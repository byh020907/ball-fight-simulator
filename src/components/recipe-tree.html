<section class="ch-recipe-tree" role="tree" aria-label="장비 조합 트리">
    <template x-for="level in tree.levels" :key="level[0].depth">
        <div class="ch-recipe-tree-level" role="group">
            <template x-for="node in level" :key="node.key">
                <article
                    class="ch-recipe-tree-node"
                    :class="{ 'is-root': node.isRoot, 'is-satisfied': !node.isRoot && node.satisfied, 'is-missing': !node.isRoot && !node.satisfied }"
                    role="treeitem"
                    :aria-label="node.name + ': 보유 ' + node.owned + ', 필요 ' + node.required + ', ' + (node.isRoot ? '결과 장비' : (node.satisfied ? '충족' : '부족 ' + (node.required - node.owned)))"
                >
                    <canvas x-equipment-icon-tag="node.iconTag" aria-hidden="true"></canvas>
                    <strong x-text="node.name"></strong>
                    <span class="ch-recipe-tree-count" x-text="`보유 ${node.owned}/${node.required}`"></span>
                    <span
                        class="ch-recipe-tree-status"
                        x-text="node.isRoot ? '결과' : node.satisfied ? '✓ 충족' : `! 부족 ${node.required - node.owned}`"
                    ></span>
                    <span
                        class="ch-recipe-tree-quantity"
                        x-show="node.required >= 2"
                        x-text="`×${node.required}`"
                    ></span>
                </article>
            </template>
        </div>
    </template>
</section>
