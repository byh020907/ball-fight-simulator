<section class="player-panel" id="playerPanel" x-data="playerPanel" x-bind:class="{ locked: locked }">
    <div class="player-panel-actions" aria-label="보조 메뉴">
        <button class="help-icon" type="button" title="게임 도움말" @click="openHelp()">?</button>
        <button
            class="collection-icon"
            type="button"
            title="컬렉션"
            aria-label="컬렉션 열기"
            @click="openCollectionHub()"
        >
            C
        </button>
    </div>
    <div class="player-title">
        <span>내 캐릭터</span>
        <div class="player-title-row">
            <canvas class="character-portrait player-character-portrait" x-character-portrait="portrait"></canvas>
            <strong x-text="fighter?.name" x-bind:style="'color:' + (fighter?.color || '#000')"></strong>
        </div>
    </div>
    <p class="player-note">
        <span x-text="fighter?.title || ''"></span>
    </p>
    <div class="challenge-level-row" x-show="!locked">
        <span class="challenge-label">토너먼트 도전</span>
        <strong class="challenge-value" x-text="tournamentTierLabel"></strong>
        <span class="challenge-max" x-text="'상대 Lv.' + tournamentOpponentLevel + ' 시작'"></span>
    </div>
    <div class="player-xp-meter">
        <div class="player-xp-head">
            <strong x-text="experience.levelLabel"></strong>
            <span x-text="Number(experience.totalXp || 0).toLocaleString() + ' XP'"></span>
        </div>
        <div class="player-xp-bar" aria-hidden="true">
            <div
                class="player-xp-fill"
                x-bind:style="'width:' + (experience.progressPct || 0) + '%; background:' + (fighter?.color || '#59d6ff')"
            ></div>
        </div>
        <div class="player-xp-foot">
            <span x-text="experience.progressText"></span>
            <span x-text="experience.nextText"></span>
        </div>
        <div class="player-xp-reward" x-show="experience.nextRewardText" x-text="experience.nextRewardText"></div>
    </div>
    <div class="player-equipment-panel">
        <div class="player-equipment-head">
            <strong>장비</strong>
            <span
                x-text="'Lv.' + (equipmentSummary.characterLevel || 1) + ' · ' + equipmentSummary.inventoryUsed + '/' + equipmentSummary.inventorySlots"
            ></span>
        </div>
        <div class="player-equipment-slots">
            <template x-for="slot in equipmentSummary.slots" :key="slot.id">
                <div class="player-equipment-slot" x-bind:class="{ empty: slot.empty, locked: slot.locked }">
                    <span x-text="slot.label"></span>
                    <b x-text="slot.name"></b>
                    <em x-show="slot.locked" x-text="'Lv.' + slot.requiredLevel"></em>
                </div>
            </template>
        </div>
        <div class="player-equipment-foot">
            <span x-text="equipmentSummary.statLine"></span>
            <button type="button" @click="openEquipmentHub()">장비 화면</button>
        </div>
    </div>
</section>
<script>
    window.createGameUI("playerPanel", () => ({
        fighter: null,
        portrait: null,
        experience: {
            levelLabel: "Lv.1",
            totalXp: 0,
            progressPct: 0,
            progressText: "0/100 XP",
            nextText: "다음 레벨까지 100XP",
            nextRewardText: ""
        },
        equipmentSummary: {
            characterLevel: 1,
            inventoryUsed: 0,
            inventorySlots: 5,
            equippedCount: 0,
            activeCount: 0,
            slots: [],
            statLine: "적용 중인 장비 스탯 없음"
        },
        locked: false,
        tournamentTierLabel: "첫 도전",
        tournamentOpponentLevel: 1,
        adjustChallengeLevel(delta) {
            Alpine.store("uiManager").invokeGameAction("adjustChallengeLevel", delta);
        },
        openCollectionHub(tabId) {
            Alpine.store("uiManager").invokeGameAction("openCollectionHub", tabId);
        },
        openEquipmentHub() {
            Alpine.store("uiManager").invokeGameAction("openEquipmentHub");
        },
        openHelp() {
            Alpine.store("uiManager").invokeGameAction("openHelp");
        },
        reset() {
            this.fighter = null;
            this.portrait = null;
            this.experience = {
                levelLabel: "Lv.1",
                totalXp: 0,
                progressPct: 0,
                progressText: "0/100 XP",
                nextText: "다음 레벨까지 100XP",
                nextRewardText: ""
            };
            this.equipmentSummary = {
                characterLevel: 1,
                inventoryUsed: 0,
                inventorySlots: 5,
                equippedCount: 0,
                activeCount: 0,
                slots: [],
                statLine: "적용 중인 장비 스탯 없음"
            };
            this.locked = false;
            this.tournamentTierLabel = "첫 도전";
            this.tournamentOpponentLevel = 1;
        }
    }));
</script>
